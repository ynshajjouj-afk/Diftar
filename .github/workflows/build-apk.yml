name: Build AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q DaftarAlajwiba-PlayStore.zip
          cd DaftarAlajwiba-GitHub

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > DaftarAlajwiba-GitHub/daftar-upload-key.jks

      - name: Build AAB
        working-directory: DaftarAlajwiba-GitHub
        run: gradle bundleRelease --no-daemon

      - name: Sign AAB
        working-directory: DaftarAlajwiba-GitHub
        run: |
          jarsigner \
            -keystore daftar-upload-key.jks \
            -storetype PKCS12 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -signedjar app-release-signed.aab \
            app/build/outputs/bundle/release/app-release.aab \
            daftar

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daftar-alajwiba-aab
          path: DaftarAlajwiba-GitHub/app-release-signed.aab
