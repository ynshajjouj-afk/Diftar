name: Build AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q DaftarAlajwiba-PlayStore.zip
          cd DaftarAlajwiba-GitHub

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > DaftarAlajwiba-GitHub/daftar-upload-key.p12

      - name: Build AAB
        working-directory: DaftarAlajwiba-GitHub
        env:
          PLAY_KEYSTORE_PATH: ${{ github.workspace }}/DaftarAlajwiba-GitHub/daftar-upload-key.jks
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: daftar
          PLAY_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daftar-alajwiba-aab
          path: DaftarAlajwiba-GitHub/app/build/outputs/bundle/release/app-release.aab
