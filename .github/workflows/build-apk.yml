name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q DaftarAlajwiba-PlayStore.zip
          cd DaftarAlajwiba-GitHub
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: - name: Build AAB
        working-directory: DaftarAlajwiba-GitHub
        run: run: gradle bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: name: daftar-alajwiba-aab
          path: path: DaftarAlajwiba-GitHub/app/build/outputs/bundle/release/app-release.aab
